id = "bitbucket"
name = "Bitbucket"
version = "0.2.0"
wit-api = ">=0.1.0, <0.2.0"
lifecycle = "per-call"
component = "bitbucket.wasm"
publisher = "Ryuzi"
description = "Bitbucket connector: Cloud repository list/get, pull request list/create/merge/comment and issue list/create, all over a host-managed bitbucket-cloud OAuth 2.0 profile — a DISTINCT profile from Atlassian's atlassian-cloud (Bitbucket Cloud's OAuth consumer is registered and granted independently of Jira/Confluence's 3LO app; the two never share a token). Every mutating tool (pr_create, pr_merge, pr_comment, issue_create) is gated behind an explicit `confirm=true` argument — an unconfirmed mutation never leaves the component."

# The only hosts the component may reach through the host-mediated OAuth
# egress (`ryuzi:oauth/oauth`'s `authorized-request`, which is bounded to this
# same allowlist). Every Bitbucket REST call goes through the Cloud API 2.0
# gateway at `api.bitbucket.org/2.0/...` — as of May 2026 ALL OAuth-authenticated
# Bitbucket API requests are directed there (the legacy per-workspace hosts are
# gone). `bitbucket.org` is where the host-driven OAuth (authorize/token)
# endpoints live — the component itself never calls bitbucket.org (that flow is
# host-side, see `crates/core/src/plugins/capabilities/oauth.rs`), but the
# profile below authorizes against it, and it is kept here to mirror how the
# Atlassian connector keeps `auth.atlassian.com` alongside `api.atlassian.com`.
[permissions]
network = ["api.bitbucket.org", "bitbucket.org"]

# Host-managed OAuth profile (Task 8). The component only ever calls
# `authorized-request("bitbucket-cloud", ..)`; it never drives the OAuth
# authorize/token exchange and never sees a token — Cockpit + the host own
# that (see crates/core/src/plugins/capabilities/oauth.rs). Field names mirror
# `ryuzi_plugin_sdk::OAuthProfile` (kebab-case).
#
# THIS IS A DISTINCT PROFILE ID FROM `atlassian-cloud` — that is the whole
# point (Task 15c isolation tests assert Jira/Confluence traffic never uses
# this profile, and every Bitbucket request fails without it). Bitbucket
# Cloud's OAuth consumer is a separate app registration
# (workspace settings -> OAuth consumers -> Add consumer) from Atlassian's
# Jira/Confluence 3LO app; the two grants share no token.
#
# authorize vs token are split across two hosts on purpose, mirroring the
# atlassian bundle:
#   - `authorize-url` stays pointed directly at bitbucket.org — user consent
#     is a browser redirect, carries no secret, and has no reason to be
#     relayed.
#   - `token-url` is routed through the Ryuzi OAuth relay (a small Cloudflare
#     Worker) instead of bitbucket.org's own token endpoint. Bitbucket Cloud
#     authenticates the code exchange with HTTP Basic `key:secret` — a
#     CONFIDENTIAL-client grant — and this is a public repo, so the secret
#     cannot be baked into a shipped manifest. The relay holds it server-side
#     (a Worker secret, never checked in) and forwards the exchange.
#   - `client-id` below is the first-party OAuth client's PUBLIC key (it
#     already appears in plaintext in every authorize URL) so Connect works
#     with zero user configuration.
#   - `client-id-setting`/`client-secret-setting` below are kept, but carry
#     the same LIMITATION as atlassian's: the relay always substitutes the
#     first-party client id and secret on the token call, so a code minted
#     for a user-supplied client would be redeemed under the wrong client and
#     rejected. Overriding the client id is NOT supported while `token-url`
#     points at the relay — same follow-up as atlassian.
[[oauth]]
id = "bitbucket-cloud"
authorize-url = "https://bitbucket.org/site/oauth2/authorize"
token-url = "https://ryuzi-oauth-relay.alfin1993.workers.dev/token/bitbucket"
client-id = "yg5R40U6Z62cJzzHLVOWygbgLE3aNPuL"
# Scopes verified against developer.atlassian.com/cloud/bitbucket/bitbucket-cloud-rest-api-scopes/
# (July 2026): `account` (GET /2.0/user, the auth_status tool); `repository`
# (read access to repos, repo_list/repo_get) — listed explicitly even though
# `pullrequest:write` below implies it, for the same reasons the Atlassian
# profile lists both read and write Jira scopes; `pullrequest:write` (implies
# `pullrequest` read + `repository:write`, covering pr_list/pr_create/
# pr_merge/pr_comment); `issue:write` (implies `issue` read, covering
# issue_list/issue_create).
scopes = ["account", "repository", "pullrequest:write", "issue:write"]
# Bitbucket Cloud OAuth consumers are registered manually per-workspace
# (workspace settings -> OAuth consumers -> Add consumer); there is no RFC
# 7591 Dynamic Client Registration endpoint. The client id/secret are
# provisioned out-of-band and supplied per-install through the settings named
# below (Task 10) — read back host-side, never by the component itself.
dynamic-registration = false
client-id-setting = "plugin.bitbucket.oauth_client_id"
client-secret-setting = "plugin.bitbucket.oauth_client_secret"

# Host-rendered configuration fields (PR-3, Task 10). Bare keys — the host
# namespaces them to `plugin.bitbucket.<key>` when it bridges this bundle
# into the plugin list; `client-id-setting`/`client-secret-setting` above
# reference the namespaced form directly.
[[settings]]
key = "oauth_client_id"
label = "OAuth client id"
help = "From your Bitbucket Cloud OAuth consumer (workspace settings -> OAuth consumers)."
required = false

[[settings]]
key = "oauth_client_secret"
label = "OAuth client secret"
help = "From your Bitbucket Cloud OAuth consumer (workspace settings -> OAuth consumers)."
secret = true
required = false

# The tools this component exposes to agents (name/description copied verbatim
# from `plugins/bitbucket/src/logic.rs::tool_definitions`). `writes = true`
# marks every tool that mutates Bitbucket state — exactly the ones gated
# behind `confirm=true` in the component (see the description above).
[[tools]]
name = "auth_status"
description = "Report whether Bitbucket is connected, and which account the connection can reach."

[[tools]]
name = "repo_list"
description = "List repositories in a workspace. Requires workspace."

[[tools]]
name = "repo_get"
description = "Get one repository. Requires workspace and repo_slug."

[[tools]]
name = "pr_list"
description = "List pull requests in a repository. Requires workspace and repo_slug."

[[tools]]
name = "issue_list"
description = "List issues in a repository. Requires workspace and repo_slug."

[[tools]]
name = "pr_create"
description = "Create a pull request. Mutating: requires confirm=true."
writes = true

[[tools]]
name = "pr_merge"
description = "Merge a pull request. Mutating: requires confirm=true."
writes = true

[[tools]]
name = "issue_create"
description = "Create an issue. Mutating: requires confirm=true."
writes = true

[[tools]]
name = "pr_comment"
description = "Comment on a pull request. Mutating: requires confirm=true."
writes = true
